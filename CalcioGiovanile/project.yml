name: CalcioGiovanile
options:
  bundleIdPrefix: it.calciogiovanile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CalcioGiovanile:
    type: application
    platform: iOS
    sources:
      - path: CalcioGiovanile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.calciogiovanile.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Calcio Giovanile"
        INFOPLIST_KEY_NSCameraUsageDescription: "La fotocamera serve per registrare le partite."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Il microfono serve per registrare l'audio delle partite."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Serve per importare video di partite già registrate."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Serve per salvare i video delle partite nel Rullino."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  CalcioGiovanileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CalcioGiovanileTests
    dependencies:
      - target: CalcioGiovanile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CalcioGiovanile:
    build:
      targets:
        CalcioGiovanile: all
        CalcioGiovanileTests: [test]
    test:
      targets:
        - CalcioGiovanileTests
